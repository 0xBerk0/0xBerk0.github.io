---
layout: default
---

<section class="page-head wrap">
  <p class="crumb"><a href="{{ '/' | relative_url }}">~</a>/{{ page.title | downcase | slugify }}</p>
  <h1 class="page-head__title glitch" data-text="{{ page.title | upcase }}">{{ page.title | upcase }}</h1>
</section>

<article class="wrap">
  <div class="prose prose--narrow">
    {{ content }}
  </div>
</article>

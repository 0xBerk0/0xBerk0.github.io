theme: jekyll-theme-chirpy
lang: en
timezone: Europe/Lisbon
title: 0xBerk
tagline: "Offensive Security // Red Team // Active Directory"
description: >-
  Writeups, red team research and offensive development notes by 0xBerk.
  CPTS & CRTO certified — breaking things to understand them.
url: "https://0xBerk0.github.io"
baseurl: ""

github:
  username: root4win

social:
  name: 0xBerk
  links:
    - https://github.com/0xBerk0
    - https://www.linkedin.com/in/antónio-rodrigues-55996b2ab

avatar: /assets/img/profile.jpg

theme_mode: dark
toc: true
paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
